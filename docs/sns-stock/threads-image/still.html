<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>threads image</title>
<!-- Threads の投稿に付ける画像（正方形 1080×1080。spec.ratio が '4:5' なら 1080×1350＝11月分まで）。render-still.mjs が window.render(spec) を呼んで1枚ずつ撮る。
     spec はストックの Threads 本文から作る（render-still.mjs の toSpec）。デザインの色は DESIGN.md のダークテーマ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=block" rel="stylesheet">
<style>
:root{--void:#08060f;--panel:#0d0b20;--gold:#c9a84c;--gold-lt:#e8c96a;--violet-lt:#c4a8f5;--text:#e8e2f5;--muted:#8a7db5}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--void)}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;
  background:
    radial-gradient(ellipse 800px 600px at 15% 12%,rgba(124,77,206,.32),transparent 70%),
    radial-gradient(ellipse 760px 760px at 92% 78%,rgba(70,52,160,.26),transparent 70%),
    linear-gradient(180deg,#0b0818 0%,#130d28 50%,#08060f 100%)}
canvas{position:absolute;left:0;top:0}
#frame{position:absolute;inset:28px;border:1.5px solid rgba(201,168,76,.35);border-radius:28px}
#content{position:absolute;left:84px;right:84px;top:76px;bottom:62px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
#label{font-family:'Shippori Mincho',serif;font-weight:600;font-size:40px;color:var(--gold-lt);letter-spacing:.3em;padding-left:.3em;white-space:nowrap;flex:none}
#label::before,#label::after{content:'';display:inline-block;width:60px;height:2px;margin:0 .55em .32em;vertical-align:middle;background:linear-gradient(90deg,transparent,var(--gold))}
#label::after{background:linear-gradient(90deg,var(--gold),transparent)}
#emblem{flex:none;margin-top:34px;position:relative}
.seal{width:150px;height:150px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(232,201,106,.22),rgba(13,11,32,.9) 70%);box-shadow:0 0 0 8px rgba(201,168,76,.12),0 0 60px rgba(232,201,106,.25)}
.seal span{font-family:'Shippori Mincho',serif;font-weight:800;font-size:76px;color:var(--gold-lt);line-height:1;text-shadow:0 0 20px rgba(232,201,106,.6)}
.card{width:176px;height:290px;border-radius:16px;border:2.5px solid var(--gold);background:var(--panel);position:relative;
  box-shadow:0 0 0 1px rgba(232,201,106,.25),0 0 70px rgba(232,201,106,.22)}
.card::before{content:'';position:absolute;inset:9px;border:1px solid rgba(201,168,76,.55);border-radius:10px}
.card .num{position:absolute;top:20px;width:100%;text-align:center;font-family:'Shippori Mincho',serif;font-weight:800;font-size:40px;color:var(--gold-lt)}
.card svg{position:absolute;left:38px;top:84px}
.card .en{position:absolute;bottom:42px;width:100%;text-align:center;font-family:'Shippori Mincho',serif;font-weight:600;font-size:15px;letter-spacing:.2em;color:var(--gold-lt);padding-left:.2em;white-space:nowrap}
.card .ja{position:absolute;bottom:18px;width:100%;text-align:center;font-family:'Shippori Mincho',serif;font-size:16px;letter-spacing:.2em;color:var(--muted)}
#main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;width:100%;min-height:0;padding:26px 0}
#text{font-family:'Shippori Mincho',serif;font-weight:800;text-align:center;line-height:1.45;font-feature-settings:'palt';word-break:auto-phrase;text-wrap:balance;text-shadow:0 2px 16px rgba(8,6,15,.9)}
#text p+p{margin-top:.25em}
#text em{font-style:normal;color:var(--gold-lt)}
#choices{flex:none;width:100%;display:flex;flex-direction:column;gap:16px}
.choice{display:flex;align-items:center;gap:22px;padding:0 26px;min-height:86px;border-radius:16px;
  background:rgba(30,23,56,.86);border:2px solid rgba(201,168,76,.55);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.choice b{flex:none;width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,var(--gold-lt),var(--gold));color:#1a1230;
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;line-height:54px;text-align:center}
.choice span{font-weight:700;letter-spacing:.02em;line-height:1.25;font-feature-settings:'palt';word-break:auto-phrase}
#footer{flex:none;margin-top:30px;font-weight:700;font-size:34px;color:var(--gold-lt);letter-spacing:.04em;text-align:center}
#brand{flex:none;margin-top:22px;display:flex;align-items:center;gap:18px}
#brand img{height:46px}
#brand span{font-size:24px;color:var(--muted);letter-spacing:.08em}
/* 正方形（1080×1080）。2026-10-29 ユーザー決定：12月分から。4:5 だと Threads のPC表示で左寄りに見えるため */
html.sq,html.sq body,html.sq #stage{height:1080px}
.sq #content{left:76px;right:76px;top:58px;bottom:46px}
.sq #label{font-size:34px}
.sq #emblem{margin-top:18px}
.sq .seal{width:104px;height:104px;box-shadow:0 0 0 6px rgba(201,168,76,.12),0 0 44px rgba(232,201,106,.25)}
.sq .seal span{font-size:54px}
.sq .card{transform:scale(.62);transform-origin:top center;margin-bottom:-110px}
.sq #main{padding:14px 0}
.sq #choices{gap:10px}
.sq .choice{min-height:68px;padding:0 22px;gap:16px;border-radius:14px}
.sq .choice b{width:46px;height:46px;line-height:46px;font-size:26px}
.sq #footer{margin-top:18px;font-size:30px}
.sq #brand{margin-top:12px}
.sq #brand img{height:40px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky" width="1080" height="1350"></canvas>
  <div id="frame"></div>
  <div id="content">
    <div id="label"></div>
    <div id="emblem"></div>
    <div id="main"><div id="text"></div></div>
    <div id="choices"></div>
    <div id="footer"></div>
    <div id="brand"><img id="logo" src="../../../img/brand/mitsuboshi/logo-pattern1-dark-h96.png" alt=""><span>life-fun.net</span></div>
  </div>
</div>
<script>
(function () {
  const $ = (q) => document.querySelector(q);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // 「」で囲んだ語を金色にする
  const deco = (s) => esc(s).replace(/「([^「」]{1,14})」/g, '「<em>$1</em>」');

  function drawSky(seed, H) {
    const ctx = $('#sky').getContext('2d');
    const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    ctx.canvas.height = H;
    ctx.clearRect(0, 0, 1080, H);
    for (let i = 0; i < 260; i++) {
      const x = rnd() * 1080, y = rnd() * H, r = .5 + Math.pow(rnd(), 3) * 2.2;
      ctx.globalAlpha = .15 + rnd() * .6;
      ctx.fillStyle = rnd() < .25 ? '#c4a8f5' : '#fff8ec';
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    }
    // みつぼし（オリオン座の三つ星）
    const belt = [[842, 150], [906, 118], [970, 86]];
    ctx.globalAlpha = .5; ctx.strokeStyle = '#e8c96a'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(...belt[0]); ctx.lineTo(...belt[2]); ctx.stroke();
    for (const [x, y] of belt) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, 28);
      g.addColorStop(0, 'rgba(255,246,220,1)'); g.addColorStop(.2, 'rgba(232,201,106,.7)'); g.addColorStop(1, 'rgba(232,201,106,0)');
      ctx.globalAlpha = .9; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 28, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const STAR = '<svg width="100" height="100" viewBox="-50 -50 100 100"><g fill="none" stroke="#c9a84c"><circle r="46" stroke-opacity=".5" stroke-width="1.2"/><circle r="30" stroke-opacity=".35"/></g>'
    + '<path d="M0-44L10-10L44 0L10 10L0 44L-10 10L-44 0L-10-10Z" fill="#e8c96a" fill-opacity=".85"/>'
    + '<path d="M0-26L6-6L26 0L6 6L0 26L-6 6L-26 0L-6-6Z" fill="#fff4d6" fill-opacity=".6" transform="rotate(45)"/></svg>';

  /** spec を描いて、文字が収まるまで小さくする。終わったら true */
  window.render = async function (spec) {
    const square = spec.ratio !== '4:5';
    document.documentElement.classList.toggle('sq', square);
    drawSky(spec.seed || 1, square ? 1080 : 1350);
    $('#label').textContent = spec.label;
    const em = spec.emblem || {};
    $('#emblem').innerHTML = em.type === 'card'
      ? '<div class="card"><div class="num">?</div>' + STAR + '<div class="en"' + (String(em.name).length > 11 ? ' style="font-size:12px;letter-spacing:.06em;padding-left:.06em"' : '') + '>' + esc(em.name) + '</div><div class="ja">' + esc(em.nameJa) + '</div></div>'
      : '<div class="seal"><span>' + esc(em.glyph || '占') + '</span></div>';
    $('#text').innerHTML = spec.text.map((l) => '<p>' + deco(l) + '</p>').join('');
    $('#choices').innerHTML = (spec.choices || []).map((c) => '<div class="choice"><b>' + esc(c.mark) + '</b><span>' + deco(c.text) + '</span></div>').join('');
    $('#choices').style.display = (spec.choices || []).length ? '' : 'none';
    $('#footer').textContent = spec.footer || '';

    const all = spec.label + spec.text.join('') + (spec.choices || []).map((c) => c.text).join('') + (spec.footer || '') + (em.name || '') + (em.nameJa || '') + (em.glyph || '');
    await Promise.all([
      document.fonts.load('800 60px "Shippori Mincho"', all),
      document.fonts.load('600 40px "Shippori Mincho"', all),
      document.fonts.load('700 40px "Zen Kaku Gothic New"', all),
      document.fonts.load('500 24px "Zen Kaku Gothic New"', 'life-fun.net'),
    ]);
    await document.fonts.ready;

    // 文字の大きさ：本文は大きいほうから、選択肢は 42px から。はみ出す間は1pxずつ小さくする
    const main = $('#main'), text = $('#text'), content = $('#content');
    const maxText = spec.choices && spec.choices.length ? (square ? 50 : 56) : (square ? 62 : 66);
    let ts = maxText, cs = square ? 38 : 42;
    const apply = () => {
      text.style.fontSize = ts + 'px';
      document.querySelectorAll('.choice span').forEach((s) => { s.style.fontSize = cs + 'px'; });
    };
    const overflow = () => text.scrollHeight > main.clientHeight - 52 || content.scrollHeight > content.clientHeight;
    apply();
    while (overflow() && (ts > 32 || cs > 30)) {
      if (ts > 32 && (ts - 32) / 18 >= (cs - 30) / 8) ts--; else cs--;
      apply();
    }
    window.FIT = { textSize: ts, choiceSize: cs, overflow: overflow() };
    return true;
  };

  $('#logo').decode().then(() => document.fonts.ready).then(() => { window.READY = true; });
})();
</script>
</body>
</html>
