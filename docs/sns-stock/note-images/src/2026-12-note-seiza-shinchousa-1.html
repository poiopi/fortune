<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=block">
<style>
  html, body { margin: 0; width: 1280px; height: 670px; overflow: hidden; }
  body { font-family: "Noto Sans JP", "Yu Gothic", sans-serif; background: radial-gradient(ellipse at 75% 0%, #7a4fd6 0%, #4a2f9a 38%, #24164f 75%, #1a1130 100%); color: #f4f0ff; position: relative; }
  .stars { position: absolute; inset: 0; }
  .line { position: absolute; left: 80px; right: 80px; height: 2px; background: #a98a4f; opacity: .8; }
  .brand { position: absolute; width: 100%; text-align: center; color: #b9a9e6; opacity: .85; }
  .kicker { position: absolute; width: 100%; text-align: center; color: #f2c95a; font-weight: 700; letter-spacing: .04em; text-shadow: 0 2px 6px rgba(0,0,0,.4); }  .line.top { top: 46px; } .line.bottom { top: 612px; }
  .kicker { top: 62px; font-size: 30px; }
  .chart { position: absolute; top: 118px; left: 150px; right: 150px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 18px; height: 30px; }
  .lab { width: 100px; text-align: right; font-size: 22px; font-weight: 700; }
  .track { flex: 1; position: relative; }
  .bar { height: 22px; border-radius: 0 6px 6px 0; background: #9b86e8; position: relative; }
  .bar.hi { background: #f2c95a; }
  .bar span { position: absolute; left: calc(100% + 10px); top: -3px; font-size: 20px; white-space: nowrap; }
  .avg { position: absolute; top: 112px; height: 456px; left: calc(150px + 118px + (1280px - 300px - 118px) * 0.5031); border-left: 2px dashed rgba(255,255,255,.55); }
  .avgl { position: absolute; top: 574px; left: calc(150px + 118px + (1280px - 300px - 118px) * 0.5031 - 60px); width: 120px; text-align: center; font-size: 18px; color: #d7cbff; }
  .brand { top: 626px; font-size: 22px; }
</style></head>
<body>
<svg class="stars" width="1280" height="670" id="s"></svg>
<div class="line top"></div>
<div class="kicker">12星座別「恋愛の慎重さ」が高めに出る割合</div>
<div class="chart">
<div class="row"><div class="lab">牡牛座</div><div class="track"><div class="bar hi" style="width:86.7%"><span>55.5%</span></div></div></div>
<div class="row"><div class="lab">乙女座</div><div class="track"><div class="bar hi" style="width:73.3%"><span>46.9%</span></div></div></div>
<div class="row"><div class="lab">山羊座</div><div class="track"><div class="bar hi" style="width:73.3%"><span>46.9%</span></div></div></div>
<div class="row"><div class="lab">獅子座</div><div class="track"><div class="bar hi" style="width:50.5%"><span>32.3%</span></div></div></div>
<div class="row"><div class="lab">蠍座</div><div class="track"><div class="bar hi" style="width:50.5%"><span>32.3%</span></div></div></div>
<div class="row"><div class="lab">水瓶座</div><div class="track"><div class="bar hi" style="width:50.5%"><span>32.3%</span></div></div></div>
<div class="row"><div class="lab">牡羊座</div><div class="track"><div class="bar " style="width:36.6%"><span>23.4%</span></div></div></div>
<div class="row"><div class="lab">双子座</div><div class="track"><div class="bar " style="width:36.6%"><span>23.4%</span></div></div></div>
<div class="row"><div class="lab">蟹座</div><div class="track"><div class="bar " style="width:36.6%"><span>23.4%</span></div></div></div>
<div class="row"><div class="lab">天秤座</div><div class="track"><div class="bar " style="width:36.6%"><span>23.4%</span></div></div></div>
<div class="row"><div class="lab">射手座</div><div class="track"><div class="bar " style="width:36.6%"><span>23.4%</span></div></div></div>
<div class="row"><div class="lab">魚座</div><div class="track"><div class="bar " style="width:36.6%"><span>23.4%</span></div></div></div>
</div>
<div class="avg"></div><div class="avgl">平均 32.2%</div>
<div class="line bottom"></div>
<div class="brand">みつぼし占い ｜ life-fun.net　（Love Engine 全9216通りの診断結果より）</div>
<script>
  let seed = 491; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const s = document.getElementById('s');
  for (let i = 0; i < 220; i++) { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('cx', (rnd() * 1280).toFixed(1)); c.setAttribute('cy', (rnd() * 670).toFixed(1)); c.setAttribute('r', (rnd() * 1.3 + 0.4).toFixed(2)); c.setAttribute('fill', '#ffffff'); c.setAttribute('opacity', (rnd() * 0.6 + 0.25).toFixed(2)); s.appendChild(c); }
</script>
</body></html>
