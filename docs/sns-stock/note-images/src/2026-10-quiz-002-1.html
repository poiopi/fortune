<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=block">
<style>
  html, body { margin: 0; width: 1280px; height: 670px; overflow: hidden; }
  body {
    font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    background: radial-gradient(ellipse at 75% 0%, #7a4fd6 0%, #4a2f9a 38%, #24164f 75%, #1a1130 100%);
    color: #f4f0ff; position: relative;
  }
  .stars { position: absolute; inset: 0; }
  .line { position: absolute; left: 80px; right: 80px; height: 2px; background: #a98a4f; opacity: .8; }
  .line.top { top: 110px; } .line.bottom { top: 560px; }
  .kicker { position: absolute; top: 140px; width: 100%; text-align: center; color: #f2c95a; font-weight: 700; font-size: 34px; letter-spacing: .04em; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .cols { position: absolute; top: 225px; left: 130px; right: 130px; display: flex; gap: 48px; }
  .col { flex: 1; border: 1.5px solid rgba(242,201,90,.55); border-radius: 18px; padding: 30px 28px 26px; background: rgba(20,12,45,.35); text-align: center; }
  .pos { color: #f2c95a; font-size: 28px; font-weight: 700; margin-bottom: 14px; }
  .key { font-size: 46px; font-weight: 900; line-height: 1.25; text-shadow: 0 3px 8px rgba(0,0,0,.45); }
  .sub { margin-top: 16px; font-size: 24px; color: #d7cbff; line-height: 1.5; }
  .brand { position: absolute; top: 588px; width: 100%; text-align: center; color: #b9a9e6; font-size: 26px; opacity: .85; }
</style></head>
<body>
<svg class="stars" width="1280" height="670" id="s"></svg>
<div class="line top"></div>
<div class="kicker">― 「死神」の読み方 ―</div>
<div class="cols">
  <div class="col"><div class="pos">正位置</div><div class="key">終わりと始まり</div><div class="sub">区切りを迎え、<br>次の段階へ移っていく</div></div>
  <div class="col"><div class="pos">逆位置</div><div class="key">手放せない気持ち</div><div class="sub">終わるべきものに<br>しがみついている状態</div></div>
</div>
<div class="line bottom"></div>
<div class="brand">みつぼし占い ｜ life-fun.net</div>
<script>
  // 星（決まった乱数で毎回同じ配置）
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const s = document.getElementById('s');
  for (let i = 0; i < 220; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', (rnd() * 1280).toFixed(1)); c.setAttribute('cy', (rnd() * 670).toFixed(1));
    c.setAttribute('r', (rnd() * 1.3 + 0.4).toFixed(2)); c.setAttribute('fill', '#ffffff'); c.setAttribute('opacity', (rnd() * 0.6 + 0.25).toFixed(2));
    s.appendChild(c);
  }
</script>
</body></html>
