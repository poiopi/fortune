<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>quiz video</title>
<!-- Threads 用のクイズ動画（1080×1920・9:16）。render.mjs が seek(t) を1コマずつ呼んで撮影する。
     時間で勝手に動く CSS アニメーションは使わない（撮影のコマと絵がずれるため）。すべて seek(t) で決める。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=block" rel="stylesheet">
<style>
:root{--void:#08060f;--card:#1e1738;--panel:#0d0b20;--gold:#c9a84c;--gold-lt:#e8c96a;--violet:#9b72ef;--violet-lt:#c4a8f5;--text:#e8e2f5;--muted:#8a7db5}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--void)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-feature-settings:'palt';
  background:
    radial-gradient(ellipse 900px 700px at 18% 16%,rgba(124,77,206,.30),transparent 70%),
    radial-gradient(ellipse 800px 900px at 88% 66%,rgba(70,52,160,.24),transparent 70%),
    linear-gradient(180deg,#0b0818 0%,#130d28 46%,#08060f 100%)}
canvas{position:absolute;left:0;top:0}
.abs{position:absolute}
#label{top:132px;width:100%;text-align:center;font-family:'Shippori Mincho',serif;font-weight:600;font-size:46px;color:var(--gold-lt);letter-spacing:.32em;white-space:nowrap}
#label::before,#label::after{content:'';display:inline-block;width:70px;height:2px;margin:0 .6em .35em;vertical-align:middle;background:linear-gradient(90deg,transparent,var(--gold))}
#label::after{background:linear-gradient(90deg,var(--gold),transparent)}
#halo{left:140px;top:150px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(232,201,106,.42) 0%,rgba(201,168,76,.16) 38%,transparent 68%)}
#flash{left:0;top:0;width:1080px;height:1920px;background:radial-gradient(circle at 540px 550px,rgba(255,244,214,.95) 0%,rgba(232,201,106,.4) 22%,transparent 50%)}
#scene{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:2400px;perspective-origin:540px 560px}
#card{left:348px;top:240px;width:384px;height:640px;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;overflow:hidden}
.back{transform:rotateY(180deg)}
.front{background:var(--panel);border:3px solid var(--gold);box-shadow:0 0 0 1px rgba(232,201,106,.25),0 30px 80px rgba(0,0,0,.6)}
.front::before{content:'';position:absolute;inset:14px;border:1.5px solid rgba(201,168,76,.55);border-radius:14px}
.numeral{position:absolute;top:34px;left:0;width:100%;text-align:center;font-family:'Shippori Mincho',serif;font-weight:800;font-size:64px;line-height:1;color:var(--gold-lt);text-shadow:0 0 24px rgba(232,201,106,.7)}
.art-glow{position:absolute;left:22px;top:118px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(232,201,106,.35),transparent 65%)}
.art{position:absolute;left:32px;top:128px;width:320px;height:320px;background-size:cover;background-position:center;
  -webkit-mask-image:radial-gradient(circle,#000 50%,transparent 70%);mask-image:radial-gradient(circle,#000 50%,transparent 70%)}
.name{position:absolute;bottom:62px;left:0;width:100%;text-align:center;font-family:'Shippori Mincho',serif;font-weight:600;font-size:34px;letter-spacing:.34em;color:var(--gold-lt);padding-left:.34em}
.name-ja{position:absolute;bottom:30px;left:0;width:100%;text-align:center;font-family:'Shippori Mincho',serif;font-size:22px;letter-spacing:.3em;color:var(--muted);padding-left:.3em}
#q{top:938px;width:100%;text-align:center}
.qline{display:block;font-family:'Shippori Mincho',serif;font-weight:800;font-size:60px;line-height:80px;white-space:nowrap;text-shadow:0 2px 18px rgba(8,6,15,.9)}
.qline em{font-style:normal;color:var(--gold-lt)}
.choice{left:150px;width:780px;height:100px;border-radius:18px;overflow:hidden;
  background:rgba(30,23,56,.84);border:2px solid rgba(201,168,76,.55);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.choice .badge{position:absolute;left:24px;top:20px;width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,var(--gold-lt),var(--gold));color:#1a1230;
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:34px;line-height:60px;text-align:center}
.choice .txt{position:absolute;left:112px;top:0;line-height:96px;font-weight:700;font-size:50px;letter-spacing:.04em}
.choice .shine{position:absolute;top:-20px;left:0;width:160px;height:140px;background:linear-gradient(100deg,transparent,rgba(255,240,200,.28),transparent);transform:translateX(-200px) skewX(-20deg)}
#cta{top:1712px;width:100%;text-align:center;font-weight:700;font-size:38px;color:var(--gold-lt);letter-spacing:.04em}
#brand{top:1800px;width:100%;display:flex;justify-content:center;align-items:center;gap:22px}
#brand img{height:54px}
#brand span{font-size:28px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky" width="1080" height="1920"></canvas>
  <div id="label" class="abs"></div>
  <div id="halo" class="abs"></div>
  <div id="scene">
    <div id="card" class="abs">
      <div class="face back">
        <svg width="384" height="640" viewBox="0 0 384 640">
          <defs><radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#2a1d52"/><stop offset="1" stop-color="#120c26"/></radialGradient></defs>
          <rect width="384" height="640" rx="24" fill="url(#bg)"/>
          <rect x="1.5" y="1.5" width="381" height="637" rx="23" fill="none" stroke="#c9a84c" stroke-width="3"/>
          <rect x="16" y="16" width="352" height="608" rx="14" fill="none" stroke="#c9a84c" stroke-opacity=".5" stroke-width="1.5"/>
          <g transform="translate(192 320)" fill="none" stroke="#c9a84c">
            <circle r="132" stroke-opacity=".45" stroke-width="1.5"/>
            <circle r="104" stroke-opacity=".7" stroke-width="2"/>
            <circle r="56" stroke-opacity=".5" stroke-width="1.5"/>
            <path d="M0-96L22-22L96 0L22 22L0 96L-22 22L-96 0L-22-22Z" fill="#c9a84c" fill-opacity=".18" stroke-width="2"/>
            <path d="M0-60L12-12L60 0L12 12L0 60L-12 12L-60 0L-12-12Z" fill="#e8c96a" fill-opacity=".5" stroke="none" transform="rotate(45)"/>
            <g fill="#e8c96a" stroke="none"><circle cx="-34" cy="-180" r="4"/><circle cx="0" cy="-196" r="5"/><circle cx="34" cy="-212" r="4"/>
              <circle cx="-34" cy="212" r="4"/><circle cx="0" cy="196" r="5"/><circle cx="34" cy="180" r="4"/></g>
          </g>
        </svg>
      </div>
      <div class="face front">
        <div class="numeral" id="numeral">?</div>
        <div class="art-glow"></div>
        <div class="art" id="art"></div>
        <div class="name" id="cname"></div>
        <div class="name-ja" id="cnameja"></div>
      </div>
    </div>
  </div>
  <div id="flash" class="abs"></div>
  <div id="q" class="abs"></div>
  <div id="choices"></div>
  <div id="cta" class="abs"></div>
  <div id="brand" class="abs"><img id="logo" src="../../../../img/brand/mitsuboshi/logo-pattern1-dark-h96.png" alt=""><span>life-fun.net</span></div>
</div>
<script>
(function () {
  const id = new URLSearchParams(location.search).get('id') || '2026-11-quiz-001';
  const s = document.createElement('script');
  s.src = 'specs/' + id + '.js';
  s.onload = init;
  document.head.appendChild(s);

  const $ = (q) => document.querySelector(q);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const inOutCubic = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const outBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const lerp = (a, b, x) => a + (b - a) * x;

  // 乱数は固定（何度撮っても同じ絵になる）
  let seed = 20261101;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

  const W = 1080, H = 1920;
  const stars = Array.from({ length: 340 }, () => ({
    x: rnd() * W, y: rnd() * H, r: .5 + Math.pow(rnd(), 3) * 2.2, a: .2 + rnd() * .7,
    sp: .6 + rnd() * 2.4, ph: rnd() * 6.28, v: 4 + rnd() * 10, hue: rnd() < .25 ? 'v' : 'w',
  }));
  // みつぼし（オリオン座の三つ星）。右上に並べ、線でつなぐ
  const belt = [[782, 300], [858, 262], [934, 224]];
  const dust = Array.from({ length: 90 }, (_, i) => ({
    t0: 6.2 + (i * 0.083) % 8.6, x: 120 + rnd() * 840, wob: 10 + rnd() * 30, ph: rnd() * 6.28,
    life: 3.2 + rnd() * 2.2, r: 1 + rnd() * 2.6, rise: 260 + rnd() * 380,
  }));

  let ctx, choiceEls = [], qEls = [];

  function init() {
    const S = window.SPEC;
    window.DURATION = S.duration;
    $('#label').textContent = S.label;
    $('#art').style.backgroundImage = 'url(' + S.card.image + ')';
    $('#cname').textContent = S.card.name;
    $('#cnameja').textContent = S.card.nameJa;
    $('#q').innerHTML = S.question.map((l) => '<span class="qline">' + l + '</span>').join('');
    qEls = [...document.querySelectorAll('.qline')];
    const top0 = 1196, step = 122;
    $('#choices').innerHTML = S.choices.map((c, i) =>
      '<div class="choice abs" style="top:' + (top0 + i * step) + 'px"><div class="shine"></div><div class="badge">' + 'ABCD'[i] + '</div><div class="txt">' + c + '</div></div>').join('');
    choiceEls = [...document.querySelectorAll('.choice')];
    $('#cta').textContent = S.cta;
    ctx = $('#sky').getContext('2d');

    const img = new Image();
    img.src = S.card.image;
    Promise.all([
      document.fonts.load('800 60px "Shippori Mincho"', S.question.join('')),
      document.fonts.load('600 46px "Shippori Mincho"', S.label + S.card.name),
      document.fonts.load('700 50px "Zen Kaku Gothic New"', S.choices.join('') + S.cta),
      document.fonts.load('500 28px "Zen Kaku Gothic New"', 'life-fun.net'),
      img.decode(), $('#logo').decode(),
    ]).then(() => document.fonts.ready).then(() => { window.seek(0); window.READY = true; });
  }

  function drawSky(t) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const y = ((s.y - t * s.v) % H + H) % H;
      const tw = .55 + .45 * Math.sin(t * s.sp + s.ph);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = s.hue === 'v' ? '#c4a8f5' : '#fff8ec';
      ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.283); ctx.fill();
    }
    // 三つ星：0.2〜1.2秒で順に灯り、線が伸びる
    const lp = outCubic(prog(t, .7, 1.8));
    ctx.globalAlpha = .55 * lp;
    ctx.strokeStyle = '#e8c96a'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(belt[0][0], belt[0][1]);
    const ex = lerp(belt[0][0], belt[2][0], lp), ey = lerp(belt[0][1], belt[2][1], lp);
    ctx.lineTo(ex, ey); ctx.stroke();
    belt.forEach(([x, y], i) => {
      const a = outCubic(prog(t, .2 + i * .25, .8 + i * .25));
      const tw = .8 + .2 * Math.sin(t * 2.2 + i * 1.7);
      const g = ctx.createRadialGradient(x, y, 0, x, y, 34);
      g.addColorStop(0, 'rgba(255,246,220,1)'); g.addColorStop(.18, 'rgba(232,201,106,.7)'); g.addColorStop(1, 'rgba(232,201,106,0)');
      ctx.globalAlpha = a * tw; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 34, 0, 6.283); ctx.fill();
    });
    // 金の粒（後半、下から立ちのぼる）
    for (const d of dust) {
      const age = t - d.t0;
      if (age < 0 || age > d.life) continue;
      const p = age / d.life;
      const x = d.x + Math.sin(age * 1.6 + d.ph) * d.wob;
      const y = 1900 - p * d.rise - 120;
      ctx.globalAlpha = Math.sin(p * Math.PI) * .85;
      const g = ctx.createRadialGradient(x, y, 0, x, y, d.r * 4);
      g.addColorStop(0, 'rgba(255,240,200,1)'); g.addColorStop(1, 'rgba(232,201,106,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, d.r * 4, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  window.seek = function (t) {
    drawSky(t);

    const lb = outCubic(prog(t, .3, 1.3));
    $('#label').style.opacity = lb;
    $('#label').style.letterSpacing = lerp(.6, .32, lb) + 'em';

    // カード：奥から飛んできて（0.8〜2.4秒）、裏から表へ返る（2.2〜3.2秒）。その後はゆっくり浮遊
    const fly = outCubic(prog(t, .8, 2.4));
    const flip = inOutCubic(prog(t, 2.2, 3.2));
    const idle = clamp(t - 3.2);
    const z = lerp(-2200, 0, fly), y = lerp(260, 0, fly) + Math.sin(t * 1.3) * 7 * idle;
    const ry = lerp(-180, 0, flip) + lerp(-25, 0, fly) * (1 - flip);
    const rz = lerp(-14, 0, fly) + Math.sin(t * .9) * .8 * idle;
    const card = $('#card');
    card.style.opacity = prog(t, .8, 1.2);
    card.style.transform = 'translate3d(0,' + y + 'px,' + z + 'px) rotateY(' + ry + 'deg) rotateZ(' + rz + 'deg)';

    const fl = Math.exp(-Math.pow((t - 2.75) / .22, 2));
    $('#flash').style.opacity = fl * .85;
    $('#halo').style.opacity = clamp(prog(t, 2.5, 3.4) * (.75 + .25 * Math.sin(t * 2)) + fl * .5);
    $('#halo').style.transform = 'scale(' + (1 + .04 * Math.sin(t * 1.3)) + ')';

    // 「?」の脈動（答えは出さない）
    const pulse = prog(t, 8.5, 9.5);
    $('#numeral').style.transform = 'scale(' + (1 + .1 * pulse * Math.max(0, Math.sin(t * 3.2))) + ')';

    // 問題文：1行ずつ
    qEls.forEach((el, i) => {
      const p = outCubic(prog(t, 3.3 + i * .55, 4.1 + i * .55));
      el.style.opacity = p;
      el.style.transform = 'translateY(' + lerp(34, 0, p) + 'px)';
      el.style.filter = 'blur(' + lerp(8, 0, p) + 'px)';
    });

    // 選択肢：右から順に。のちに光が横切る
    choiceEls.forEach((el, i) => {
      const a = 5.4 + i * .32;
      const p = prog(t, a, a + .7);
      el.style.opacity = outCubic(p);
      el.style.transform = 'translateX(' + lerp(90, 0, outBack(p)) + 'px)';
      const sh = prog(t, 8.6 + i * .18, 9.6 + i * .18);
      const sh2 = prog(t, 12.4 + i * .18, 13.4 + i * .18);
      const sx = sh > 0 && sh < 1 ? sh : sh2;
      el.querySelector('.shine').style.transform = 'translateX(' + lerp(-200, 960, sx) + 'px) skewX(-20deg)';
      el.style.borderColor = 'rgba(201,168,76,' + (.55 + .4 * Math.sin(sx * Math.PI)) + ')';
    });

    const c = outCubic(prog(t, 7.4, 8.2));
    $('#cta').style.opacity = c;
    $('#cta').style.transform = 'translateY(' + lerp(20, 0, c) + 'px)';
    $('#brand').style.opacity = .9 * outCubic(prog(t, .4, 1.4));
  };
})();
</script>
</body>
</html>
